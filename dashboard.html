<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodFever Dashboard</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/theme.css">
  <script src="js/shell.js"></script>
</head>
<body>
  <main>
    <h1>Today's orders</h1>
    <p id="notice" class="notice" hidden></p>

    <section class="figures" aria-label="Summary">
      <div><span id="f-count">0</span><small>Orders</small></div>
      <div><span id="f-open">0</span><small>In progress</small></div>
      <div><span id="f-done">0</span><small>Ready</small></div>
      <div><span id="f-revenue">KES 0</span><small>Revenue</small></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Orders</h2>
        <div class="filters" id="filters" role="group" aria-label="Filter by status"></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Order</th><th>Items</th><th>Deliver to</th><th>Total</th><th>Status</th><th></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="empty" class="empty" hidden>No orders match this filter.</p>
    </section>
  </main>

  <script src="js/dashboard.js"></script>
</body>
</html>
