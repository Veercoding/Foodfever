<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodFever</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/cart.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header>
    <h1>FoodFever 🍔🔥</h1>
    <p>Hot food, fast, anywhere on campus.</p>
    <div id="auth-nav" class="auth-nav"></div>

  </header>

  <main>
<section>
  <h2>Menu</h2>

  <!-- David: Menu Search -->
  <input
    type="search"
    id="menu-search"
    class="menu-search"
    placeholder="Search for food or vendors..."
    aria-label="Search food menu"
  >

  <!-- David: Food Categories -->
  <div class="menu-filters">
    <button type="button" data-category="All" class="active">All</button>
    <button type="button" data-category="Meals">Meals</button>
    <button type="button" data-category="Fast Food">Fast Food</button>
    <button type="button" data-category="Snacks">Snacks</button>
    <button type="button" data-category="Drinks">Drinks</button>
  </div>

  <!-- Food Items -->
  <div id="menu" class="menu-grid"></div>
</section>

    <aside>
      <h2>Your Cart</h2>
      <ul id="cart-items"></ul>
      <p><strong>Total: KES <span id="total">0</span></strong></p>

      <label for="location">Deliver to:</label>
      <select id="location">
        <option>Student Centre</option>
        <option>Hostels</option>
        <option>Lecture Halls</option>
        <option>Library</option>
      </select>

      <button id="order-btn">Place Order</button>
      <p id="message"></p>
    </aside>
  </main>

<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/menu.js"></script>
<script src="js/checkout-handoff.js"></script>
</body>
</html>
