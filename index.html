<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodFever</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>FoodFever 🍔🔥</h1>
    <p>Hot food, fast, anywhere on campus.</p>
  </header>

  <main>
    <section>
      <h2>Menu</h2>
      <div id="menu" class="menu-grid"></div>
    </section>

    <aside>
      <h2>Your Cart</h2>
      <ul id="cart-items"></ul>
      <p><strong>Total: KES <span id="total">0</span></strong></p>

      <label for="location">Deliver to:</label>
      <select id="location">
        <option>Student Centre</option>
        <option>Hostels</option>
        <option>Lecture Halls</option>
        <option>Library</option>
      </select>

      <button id="order-btn">Place Order</button>
      <p id="message"></p>
    </aside>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
