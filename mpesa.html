<!-- Replace the whole <dialog id="mpesa-dialog"> ... </dialog> block in index.html with this -->
<dialog id="mpesa-dialog" aria-labelledby="mpesa-title">
  <h2 id="mpesa-title">Pay with M-Pesa</h2>

  <button type="button" id="mpesa-close" aria-label="Close payment">
    Close
  </button>

  <section id="mpesa-phone-step">
    <p>Enter a phone number for the simulated STK Push.</p>

    <form id="mpesa-phone-form">
      <label for="mpesa-phone">Phone number</label>
      <input
        id="mpesa-phone"
        name="phone"
        type="tel"
        inputmode="tel"
        placeholder="2547XXXXXXXX"
        pattern="2547[0-9]{8}"
        title="Enter a number in the format 2547XXXXXXXX"
        required
      >

      <p>Amount: KES <strong id="mpesa-total">0</strong></p>
      <button type="submit">Request payment</button>
    </form>
  </section>

  <section id="mpesa-wait-step" hidden aria-live="polite">
    <h3>STK Push requested</h3>
    <p>Simulating the payment prompt…</p>
  </section>

  <section id="mpesa-pin-step" hidden>
    <h3>Simulated payment confirmation</h3>
    <p>This is a demo. Never enter your real M-Pesa PIN.</p>

    <label for="mpesa-outcome">Choose a demo outcome</label>
    <select id="mpesa-outcome">
      <option value="success">Payment successful</option>
      <option value="insufficient-funds">Insufficient funds</option>
      <option value="invalid-pin">Invalid PIN</option>
      <option value="timeout">Request timed out</option>
    </select>

    <button type="button" id="mpesa-confirm">Simulate outcome</button>
  </section>

  <p id="mpesa-message" role="status" aria-live="polite"></p>
</dialog>
